# Add these locations to the www.kadimag.ru HTTPS server before its canonical
# redirect. The www origin is reserved for the public game and does not share
# browser storage with the private application on kadimag.ru.
location = /naglaz {
    return 308 https://www.kadimag.ru/naglaz/;
}

location ^~ /naglaz/assets/ {
    root /srv/naglaz/current;
    try_files $uri @naglaz_www_previous_assets;

    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location @naglaz_www_previous_assets {
    root /srv/naglaz/previous;
    try_files $uri =404;

    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /naglaz/art/ {
    root /srv/naglaz/current;
    try_files $uri =404;

    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /naglaz/ {
    root /srv/naglaz/current;
    index index.html;
    try_files $uri $uri/ =404;

    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; child-src 'none'; media-src 'none'; worker-src 'none'; manifest-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

# Keep this last inside the www HTTPS server.
location / {
    return 308 https://kadimag.ru$request_uri;
}
