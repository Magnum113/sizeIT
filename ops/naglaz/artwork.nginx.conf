# Include inside the kadimag.ru HTTPS server, before the /naglaz/ location.
# CSP sandbox gives the game an opaque origin. Public PNGs need CORS for
# anonymous SVG image requests and CORP permission for resource loading.
location ^~ /naglaz/art/ {
    root /srv/naglaz/current;
    try_files $uri =404;

    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
}
